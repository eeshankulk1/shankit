name: Bug report
description: Something in Throukit does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead. Paste the full traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code that shows the problem. `throukit.testing.ScriptedModel` lets you reproduce without an API key.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Throukit version or commit, Python version, and the provider SDK version (anthropic / openai).
    validations:
      required: true
