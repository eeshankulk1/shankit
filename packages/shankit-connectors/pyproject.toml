[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shankit-connectors"
version = "0.1.0"
description = "Opt-in connector layer for shankit: connection lifecycle for OAuth-backed tool sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "shankit contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "shankit>=0.1.0,<0.2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
composio = ["composio>=0.8.0"]

[project.urls]
Homepage = "https://github.com/eeshankulk1/shankit"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/shankit_connectors"]

[tool.uv.sources]
shankit = { workspace = true }
